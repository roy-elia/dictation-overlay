<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; font: 13px/1.5 -apple-system, system-ui; color: #f2f2f4; -webkit-font-smoothing: antialiased; user-select: text; }
    .card { position: absolute; inset: 6px; display: flex; flex-direction: column; background: #0b0b0c; border: 1px solid #2c2c30;
      border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.45); overflow: hidden; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; -webkit-app-region: drag; }
    header svg { width: 14px; height: 14px; fill: none; stroke: #3ecf8e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    header .app { color: rgba(242,242,244,.55); font-weight: 500; }
    header .x { margin-left: auto; -webkit-app-region: no-drag; background: none; border: 0; color: rgba(242,242,244,.6); font-size: 16px; cursor: pointer; }
    .body { flex: 1; overflow: auto; padding: 4px 14px 10px; white-space: pre-wrap; }
    del { background: rgba(255,107,94,.18); color: #ffb0a8; text-decoration: line-through; border-radius: 3px; }
    ins { background: rgba(62,207,142,.18); color: #a8f0c8; text-decoration: none; border-radius: 3px; }
    footer { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #1e1e22; }
    button.b { background: #1c1c20; color: #f2f2f4; border: 1px solid #2c2c30; border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
    button.b:hover { border-color: #55555c; }
    button.b.primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    .hint { margin-left: auto; align-self: center; color: rgba(242,242,244,.45); font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.2 4.7-5"/></svg> Polished <span class="app" id="app"></span>
      <button class="x" id="close" aria-label="Close">✕</button>
    </header>
    <div class="body" id="body"></div>
    <footer>
      <button class="b primary" id="undo">Undo polish</button>
      <button class="b" id="copy">Copy original</button>
      <span class="hint" id="hint"></span>
    </footer>
  </div>
  <script src="diff.js"></script>
</body>
</html>
