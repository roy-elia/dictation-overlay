<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
  <title>Welcome to RoyFlow</title>
  <link rel="stylesheet" href="settings.css" />
  <style>
    body { display: block; -webkit-app-region: drag; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 54px 32px 28px; -webkit-app-region: no-drag; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
    .steps { display: flex; gap: 6px; margin-bottom: 26px; }
    .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
    .steps i.on { background: var(--accent); }
    .icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 18px; }
    h1 { font-size: 26px; }
    .sub { font-size: 14px; }
    .nav { margin-top: auto; display: flex; justify-content: space-between; padding-top: 24px; }
    #try { width: 100%; min-height: 110px; font-size: 15px; }
    .big { font-size: 15px; padding: 8px 18px; }
    .meter-wrap { display: flex; align-items: center; gap: 10px; }
    .meter-wrap small { color: var(--dim); font-size: 12px; min-width: 80px; }
    .meter { width: 160px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
    .meter i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 4px; transition: width .06s linear; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="steps" id="steps"></div>
    <div id="page"></div>
    <div class="nav">
      <button id="back">Back</button>
      <button class="primary big" id="next">Continue</button>
    </div>
  </div>
  <script src="onboarding.js"></script>
</body>
</html>
