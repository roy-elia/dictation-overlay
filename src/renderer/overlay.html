<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' mediastream:" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="edge-bottom">
  <div id="stage">
    <div id="pill" class="rest" role="button" aria-label="RoyFlow dictation">
      <button class="round cancel" data-action="cancel" aria-label="Cancel" title="Cancel (Esc)">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg>
      </button>
      <span class="mic" aria-hidden="true">
        <svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"/></svg>
      </span>
      <span class="dot" aria-hidden="true"></span>
      <span class="wave" aria-hidden="true"></span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="label"></span>
      <button class="round mstop" data-action="meeting-stop" aria-label="Stop meeting notes" title="Stop meeting notes">
        <svg viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" rx="1.2"/></svg>
      </button>
      <button class="round stop" data-action="stop" aria-label="Finish" title="Finish and paste">
        <svg viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" rx="1.2"/></svg>
      </button>
    </div>
  </div>
  <script src="audio.js"></script>
  <script src="meeting.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
